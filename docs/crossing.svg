<svg xmlns="http://www.w3.org/2000/svg" width="970" height="340" viewBox="0 0 970 340" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- A 24.5" 1080p beside a 27" 1440p at physical scale (9 px per inch), centered on the desk.
       Left panel: macOS maps the crossing by points. Right panel: MouseBridge maps it by physical height. -->
  <defs>
    <g id="cursor">
      <path d="M0 0 L0 17 L4.2 13 L7.2 20 L10 18.8 L7 12 L12.5 12 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <g id="desk">
      <!-- left: 24.5" 1080p -->
      <rect x="-6" y="100" width="204" height="120" rx="7" fill="#1c1c1e"/>
      <rect x="0" y="106" width="192" height="108" rx="2" fill="#0b0b0c"/>
      <rect x="86" y="220" width="20" height="14" fill="#1c1c1e"/>
      <rect x="66" y="234" width="60" height="4" rx="2" fill="#2c2c2e"/>
      <!-- right: 27" 1440p -->
      <rect x="200" y="94" width="225" height="132" rx="7" fill="#1c1c1e"/>
      <rect x="206" y="100" width="213" height="120" rx="2" fill="#0b0b0c"/>
      <rect x="302" y="226" width="20" height="10" fill="#1c1c1e"/>
      <rect x="282" y="236" width="60" height="4" rx="2" fill="#2c2c2e"/>
      <text x="96" y="262" text-anchor="middle" font-size="13" fill="#8e8e93">24.5" 1080p</text>
      <text x="312" y="262" text-anchor="middle" font-size="13" fill="#8e8e93">27" 1440p</text>
    </g>
  </defs>

  <rect width="970" height="340" rx="16" fill="#000"/>

  <!-- macOS -->
  <g transform="translate(50 0)">
    <text x="0" y="56" font-size="20" font-weight="600" fill="#fff">macOS</text>
    <use href="#desk"/>
    <!-- top quarter of the taller edge has no neighbor in points -->
    <line x1="206" y1="100" x2="206" y2="130" stroke="#ff453a" stroke-width="4"/>
    <text x="214" y="118" font-size="11" fill="#ff453a">wall</text>
    <path d="M330 160 H206" stroke="#0a84ff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M206 160 L192 142" stroke="#ff9f0a" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
    <path d="M192 142 H112" stroke="#0a84ff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="214" y="180" font-size="11" fill="#ff9f0a">jumps</text>
    <use href="#cursor" x="106" y="140"/>
    <text x="0" y="298" font-size="14" fill="#fff">Crosses by points. The cursor jumps,</text>
    <text x="0" y="318" font-size="14" fill="#fff">and the wall is in the wrong place.</text>
  </g>

  <!-- MouseBridge -->
  <g transform="translate(500 0)">
    <text x="0" y="56" font-size="20" font-weight="600" fill="#fff">MouseBridge</text>
    <use href="#desk"/>
    <!-- crosses where the shorter display physically is; the strips past it are walls -->
    <line x1="206" y1="106" x2="206" y2="214" stroke="#30d158" stroke-width="4"/>
    <line x1="206" y1="100" x2="206" y2="106" stroke="#ff453a" stroke-width="4"/>
    <line x1="206" y1="214" x2="206" y2="220" stroke="#ff453a" stroke-width="4"/>
    <text x="200" y="94" text-anchor="end" font-size="11" fill="#ff453a">wall</text>
    <text x="200" y="234" text-anchor="end" font-size="11" fill="#ff453a">wall</text>
    <path d="M330 160 H112" stroke="#0a84ff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <use href="#cursor" x="106" y="158"/>
    <text x="0" y="298" font-size="14" fill="#fff">Crosses by physical height. Straight across,</text>
    <text x="0" y="318" font-size="14" fill="#fff">and the walls match the bezels.</text>
  </g>
</svg>
